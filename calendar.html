<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>பயிர் நாட்காட்டி - Aaraa Farmers</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: 'Noto Sans Tamil', Arial, sans-serif;
    background: linear-gradient(#c8f0b0, #7ccf5a);
    min-height: 100vh; border: 14px solid #2e7d32;
  }
  .grass { position: fixed; font-size: 40px; }
  .tl { top: 0; left: 0; } .tr { top: 0; right: 0; }
  .bl { bottom: 0; left: 0; } .br { bottom: 0; right: 0; }
  .back {
    display: inline-block; background: #5d3a12; color: white;
    padding: 10px 18px; border-radius: 10px; text-decoration: none; font-size: 18px;
  }
  h1 { text-align: center; color: #1b5e20; margin: 10px 0; }
  .nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 10px 0 20px; }
  .nav button {
    font-size: 22px; background: #2e7d32; color: white; border: none;
    border-radius: 8px; padding: 6px 16px; cursor: pointer;
  }
  .nav span { font-size: 26px; font-weight: bold; color: #1b5e20; min-width: 200px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 700px; margin: 0 auto; }
  .dayname { text-align: center; font-weight: bold; color: #1b5e20; }
  .day {
    background: #f4ffe8; border: 2px solid #2e7d32; border-radius: 8px;
    min-height: 60px; padding: 4px; text-align: center; cursor: pointer; font-size: 18px;
  }
  .day:hover { background: #d7f5b8; }
  .day .emoji { display: block; font-size: 22px; }
  .empty { visibility: hidden; }
  #popup {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 10;
  }
  #popup .card {
    background: #fffbe6; border: 6px solid #5d3a12; border-radius: 16px;
    padding: 20px; width: 90%; max-width: 380px; text-align: center;
  }
  #popup img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; }
  #popup h2 { color: #1b5e20; }
  #popup button { background: #5d3a12; color: white; border: none; border-radius: 8px; padding: 8px 20px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
  <div class="grass tl">🌿🌾</div><div class="grass tr">🌾🌿</div>
  <div class="grass bl">🌱🍃</div><div class="grass br">🍃🌱</div>

  <a class="back" href="index.html">⬅ பின்செல்</a>
  <h1>📅 பயிர் நாட்காட்டி</h1>

  <div class="nav">
    <button onclick="changeMonth(-1)">◀</button>
    <span id="title"></span>
    <button onclick="changeMonth(1)">▶</button>
  </div>

  <div class="grid" id="grid"></div>

  <div id="popup" onclick="closePopup()">
    <div class="card" onclick="event.stopPropagation()">
      <img id="pimg" src="" alt="">
      <h2 id="ptitle"></h2>
      <p id="ptext"></p>
      <button onclick="closePopup()">மூடு</button>
    </div>
  </div>

<script>
  // EDIT THIS PART: add your own crops here.
  // Format: "year-month-day" (month 1 to 12). Put your images in an images folder.
  const events = {
    "2026-12-5":  { title: "நெல் அறுவடை", text: "நெல் பயிரை அறுவடை செய்யும் நேரம்.", image: "images/paddy.jpg", emoji: "🌾" },
    "2026-12-15": { title: "தக்காளி நடவு", text: "தக்காளி நாற்றுகளை நடவு செய்யலாம்.", image: "images/tomato.jpg", emoji: "🍅" }
  };

  const months = ["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
  const dayNames = ["ஞா","தி","செ","பு","வி","வெ","ச"];
  let current = new Date();
  current.setDate(1);

  function draw() {
    const y = current.getFullYear(), m = current.getMonth();
    document.getElementById("title").textContent = months[m] + " " + y;
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    dayNames.forEach(d => { grid.innerHTML += '<div class="dayname">' + d + '</div>'; });
    const first = new Date(y, m, 1).getDay();
    const total = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.innerHTML += '<div class="day empty"></div>';
    for (let d = 1; d <= total; d++) {
      const key = y + "-" + (m + 1) + "-" + d;
      const ev = events[key];
      const div = document.createElement("div");
      div.className = "day";
      div.innerHTML = d + (ev ? '<span class="emoji">' + ev.emoji + '</span>' : '');
      div.onclick = () => openPopup(ev, d);
      grid.appendChild(div);
    }
  }

  function changeMonth(n) { current.setMonth(current.getMonth() + n); draw(); }

  function openPopup(ev, d) {
    document.getElementById("pimg").style.display = ev ? "block" : "none";
    if (ev) {
      document.getElementById("pimg").src = ev.image;
      document.getElementById("ptitle").textContent = ev.title;
      document.getElementById("ptext").textContent = ev.text;
    } else {
      document.getElementById("ptitle").textContent = d + "-ஆம் தேதி";
      document.getElementById("ptext").textContent = "இந்த நாளுக்கு குறிப்பு இல்லை.";
    }
    document.getElementById("popup").style.display = "flex";
  }
  function closePopup() { document.getElementById("popup").style.display = "none"; }

  draw();
</script>
</body>
</html>
