
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>பயிர் நாட்காட்டி - Aara Farmers</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;min-height:100vh;
  font-family:Arial,sans-serif;
  border:9px solid #2e7d32;
  background:linear-gradient(#d8f5c5,#91d66e);
  overflow-x:hidden;position:relative
}
.farm{
  position:fixed;inset:0;z-index:-1;
  overflow:hidden;pointer-events:none;
  background:linear-gradient(#d8f5c5,#a6df83)
}
.sun{
  position:absolute;top:35px;right:12%;
  font-size:55px;animation:glow 4s infinite alternate
}
.cloud{
  position:absolute;top:12%;left:-100px;
  font-size:48px;animation:cloud 35s linear infinite
}
.field{
  position:absolute;bottom:0;left:-10%;
  width:130%;height:30%;
  background:repeating-linear-gradient(170deg,
    #4caf50 0 12px,#80c95b 13px 25px);
  border-radius:50% 50% 0 0;
  animation:field 12s ease-in-out infinite alternate
}
.field.two{height:20%;opacity:.7;animation-duration:16s}
.tractor{
  position:absolute;bottom:12%;font-size:42px;
  animation:tractor 22s linear infinite
}
@keyframes cloud{to{left:110%}}
@keyframes tractor{from{left:-80px}to{left:110%}}
@keyframes field{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
@keyframes glow{to{opacity:1;transform:scale(1.08)}}

.back{
  display:inline-block;background:#5d3a12;color:white;
  padding:10px 18px;border-radius:10px;
  text-decoration:none;font-size:18px;position:relative
}
h1{text-align:center;color:#1b5e20;margin:18px 0;position:relative}
.nav{
  display:flex;justify-content:center;align-items:center;
  gap:15px;margin:18px 0
}
.nav button{
  font-size:22px;background:#2e7d32;color:white;
  border:0;border-radius:8px;padding:8px 16px;cursor:pointer
}
.nav span{
  font-size:24px;font-weight:bold;color:#1b5e20;
  min-width:180px;text-align:center
}
.grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:6px;max-width:750px;margin:auto;position:relative
}
.dayname{
  text-align:center;font-weight:bold;color:#1b5e20;
  padding:8px 0
}
.day{
  background:rgba(244,255,232,.95);
  border:2px solid #2e7d32;border-radius:8px;
  min-height:65px;padding:7px 4px;text-align:center;
  cursor:pointer;font-size:18px;position:relative;
  transition:.2s
}
.day:hover{background:#d7f5b8;transform:scale(1.03)}
.star{position:absolute;top:1px;right:4px;font-size:14px}
.empty{visibility:hidden}

#popup{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  justify-content:center;align-items:center;
  z-index:10;padding:15px
}
.card{
  background:#fffbe6;border:5px solid #5d3a12;
  border-radius:16px;padding:20px;width:95%;
  max-width:430px;text-align:center;
  max-height:90vh;overflow-y:auto
}
.card h2{color:#1b5e20}
#note{
  width:100%;min-height:125px;padding:12px;
  font-size:17px;border:2px solid #6b9b42;
  border-radius:10px;resize:vertical;font-family:inherit
}
.buttons{
  display:flex;justify-content:center;
  flex-wrap:wrap;gap:10px;margin-top:15px
}
.buttons button{
  background:#5d3a12;color:white;border:0;
  border-radius:8px;padding:10px 18px;
  font-size:16px;cursor:pointer
}
.buttons .save{background:#2e7d32}
#micStatus{color:#b71c1c;font-size:14px;min-height:20px}

@media(max-width:500px){
  body{padding:10px;border-width:6px}
  .day{min-height:52px;font-size:15px}
  .nav span{font-size:19px;min-width:140px}
  .grid{gap:3px}
}
</style>
</head>

<body>

<div class="farm">
  <div class="sun">☀️</div>
  <div class="cloud">☁️</div>
  <div class="field"></div>
  <div class="field two"></div>
  <div class="tractor">🚜</div>
</div>

<a class="back" href="index.html">⬅ பின்செல்லவும்</a>

<h1>🌾 பயிர் நாட்காட்டி</h1>

<div class="nav">
  <button onclick="changeMonth(-1)">◀</button>
  <span id="title"></span>
  <button onclick="changeMonth(1)">▶</button>
</div>

<div class="grid" id="grid"></div>

<div id="popup" onclick="closePopup()">
  <div class="card" onclick="event.stopPropagation()">
    <h2 id="popupDate">தேதி</h2>
    <textarea id="note" placeholder="இந்த தேதியில் என்ன விவசாய வேலை செய்தீர்கள்?"></textarea>
    <p id="micStatus"></p>
    <div class="buttons">
      <button onclick="startVoice()">🎤 மைக்</button>
      <button class="save" onclick="saveNote()">💾 Save</button>
      <button onclick="closePopup()">Close</button>
    </div>
  </div>
</div>

<script>
const months=[
"ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்",
"ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"
];

const days=["ஞா","தி","செ","பு","வி","வெ","ச"];

let current=new Date();
current.setDate(1);
let selectedDate="";

let notes={};
try{
  notes=JSON.parse(localStorage.getItem("aaraFarmNotes")||"{}");
}catch(e){
  notes={};
}

function dateKey(y,m,d){
  return y+"-"+(m+1)+"-"+d;
}

function draw(){
  const y=current.getFullYear();
  const m=current.getMonth();
  document.getElementById("title").textContent=months[m]+" "+y;

  const grid=document.getElementById("grid");
  grid.innerHTML="";

  days.forEach(day=>{
    const heading=document.createElement("div");
    heading.className="dayname";
    heading.textContent=day;
    grid.appendChild(heading);
  });

  const first=new Date(y,m,1).getDay();
  const total=new Date(y,m+1,0).getDate();

  for(let i=0;i<first;i++){
    const empty=document.createElement("div");
    empty.className="day empty";
    grid.appendChild(empty);
  }

  for(let d=1;d<=total;d++){
    const key=dateKey(y,m,d);
    const cell=document.createElement("div");
    cell.className="day";
    cell.textContent=d;

    if(notes[key]){
      const star=document.createElement("span");
      star.className="star";
      star.textContent="⭐";
      cell.appendChild(star);
    }

    cell.onclick=()=>openPopup(key,d,m,y);
    grid.appendChild(cell);
  }
}

function changeMonth(amount){
  current.setMonth(current.getMonth()+amount);
  draw();
}

function openPopup(key,day,month,year){
  selectedDate=key;
  document.getElementById("popupDate").textContent=
    day+" "+months[month]+" "+year;

  document.getElementById("note").value=notes[key]||"";
  document.getElementById("micStatus").textContent="";
  document.getElementById("popup").style.display="flex";
}

function saveNote(){
  const value=document.getElementById("note").value.trim();

  if(!value){
    alert("முதலில் ஒரு குறிப்பை எழுதுங்கள் அல்லது மைக்கில் சொல்லுங்கள்.");
    return;
  }

  notes[selectedDate]=value;

  try{
    localStorage.setItem("aaraFarmNotes",JSON.stringify(notes));
  }catch(e){
    alert("குறிப்பை சேமிக்க முடியவில்லை.");
    return;
  }

  draw();
  closePopup();
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

function startVoice(){
  const SpeechRecognition=
    window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    document.getElementById("micStatus").textContent=
      "இந்த உலாவியில் மைக் வசதி கிடைக்கவில்லை. Chrome-ல் முயற்சி செய்யுங்கள்.";
    return;
  }

  const recognition=new SpeechRecognition();
  recognition.lang="ta-IN";
  recognition.interimResults=false;
  recognition.continuous=false;

  document.getElementById("micStatus").textContent=
    "🎤 கேட்கிறது... இப்போது பேசுங்கள்.";

  recognition.onresult=function(event){
    const spoken=event.results[0][0].transcript;
    const box=document.getElementById("note");
    box.value=box.value?box.value+" "+spoken:spoken;
    document.getElementById("micStatus").textContent=
      "உங்கள் குரல் எழுத்தாக மாற்றப்பட்டது.";
  };

  recognition.onerror=function(){
    document.getElementById("micStatus").textContent=
      "மைக் அனுமதியைச் சரிபார்த்து மீண்டும் முயற்சி செய்யுங்கள்.";
  };

  recognition.start();
}

draw();
</script>

</body>
</html>
